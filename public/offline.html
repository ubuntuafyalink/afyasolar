<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · AfyaSolar</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f4f7f4;
        color: #1a201c;
        padding: 24px;
      }
      .card {
        max-width: 28rem;
        text-align: center;
        background: #fff;
        border: 1px solid #e3e8e3;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
      }
      h1 { font-size: 1.25rem; margin: 12px 0 4px; }
      p { color: #475247; font-size: 0.95rem; line-height: 1.5; margin: 6px 0; }
      .sw { color: #6b766b; font-size: 0.85rem; margin-top: 14px; }
      .dot { width: 12px; height: 12px; border-radius: 999px; background: #d97706; display: inline-block; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="dot"></span>
      <h1>You are offline</h1>
      <p>The dashboard could not be reached. Your last saved data is still available once you reopen a cached page.</p>
      <p class="sw">Uko nje ya mtandao. Data iliyohifadhiwa bado inapatikana ukifungua tena ukurasa uliohifadhiwa.</p>
    </div>
  </body>
</html>
