# Chronos fine-tuning configuration (AutoGluon-TimeSeries harness).
#
# The pipeline forecasts the RAW NASA variables; the app's existing logic
# (nasa-power.ts, sizing engine) derives hazard indices and solar yield from the
# forecasts. We train one predictor per horizon and, in each, compare three
# models so the fine-tune's value is provable:
#   - SeasonalNaive        (baseline)
#   - Chronos-Bolt ZeroShot (pretrained, no fine-tuning)
#   - Chronos-Bolt FineTuned (LoRA fine-tuned on our NASA series)

model:
  # AutoGluon shorthand for amazon/chronos-bolt-* (Apache-2.0 on HuggingFace).
  # bolt_small = faster/cheaper (CPU-friendly), bolt_base = more accurate.
  chronos_model: bolt_small
  # fine_tune: false serves Chronos "as-is" (zero-shot) - no gradient training,
  # no GPU. Set to true (with a GPU) to LoRA fine-tune on the NASA series later.
  fine_tune: false
  fine_tune_steps: 2000
  fine_tune_lr: 1.0e-4

# One predictor per resolution (we forecast both, per the agreed plan).
horizons:
  daily:
    dataset: daily            # -> datasets/processed/daily.{parquet,csv}
    freq: D
    prediction_length: 30     # up to ~30 days ahead
    eval_metric: WQL
  monthly:
    dataset: monthly          # -> datasets/processed/monthly.{parquet,csv}
    freq: MS                  # month-start timestamps
    prediction_length: 12     # up to 12 months ahead (seasonal)
    eval_metric: WQL

train:
  output_dir: outputs         # ml/train/outputs/<horizon>/
  num_val_windows: 3          # rolling-origin backtest windows
  time_limit: 1800            # seconds per horizon (Colab-friendly)
