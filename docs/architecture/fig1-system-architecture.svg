<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1170" viewBox="0 0 720 1170" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1170" fill="#fff"/>
  <rect x="6" y="6" width="708" height="1158" fill="none" stroke="#000" stroke-width="3"/>
  <text x="360" y="40" font-size="15" text-anchor="middle">AfyaSolar Intelligence System Architecture</text>

  <!-- Layer 100: Telemetry -->
  <rect x="32" y="62" width="320" height="260" fill="none" stroke="#000" stroke-width="1"/>
  <text x="46" y="80" font-size="11">100  Telemetry Layer</text>
  <rect x="56" y="92" width="272" height="46" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="192" y="114" font-size="12" text-anchor="middle">Solar-Hybrid Inverters 110</text>
  <text x="192" y="129" font-size="10" text-anchor="middle">13 sites: load, solar, battery SoC, grid</text>
  <rect x="56" y="158" width="128" height="52" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="120" y="180" font-size="12" text-anchor="middle">Cloud Adapter 120</text>
  <text x="120" y="196" font-size="10" text-anchor="middle">(reads vendor cloud)</text>
  <rect x="200" y="158" width="128" height="52" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="264" y="180" font-size="12" text-anchor="middle">Modbus Gateway 130</text>
  <text x="264" y="196" font-size="10" text-anchor="middle">(offline-first MCU)</text>
  <rect x="56" y="240" width="272" height="46" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="192" y="262" font-size="12" text-anchor="middle">MQTT Broker and Ingestion 140</text>
  <text x="192" y="277" font-size="10" text-anchor="middle">one schema-validated message format</text>

  <!-- Layer 200: Assessment -->
  <rect x="368" y="62" width="320" height="260" fill="none" stroke="#000" stroke-width="1"/>
  <text x="382" y="80" font-size="11">200  Assessment Layer</text>
  <rect x="392" y="92" width="272" height="46" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="528" y="114" font-size="12" text-anchor="middle">Users and Roles 210</text>
  <text x="528" y="129" font-size="10" text-anchor="middle">facility manager, technician, reviewer, admin</text>
  <rect x="392" y="158" width="272" height="52" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="528" y="180" font-size="12" text-anchor="middle">Assessment Web App and SMS 220</text>
  <text x="528" y="196" font-size="10" text-anchor="middle">inventory, outages, energy costs, hazards</text>
  <rect x="392" y="240" width="272" height="46" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="528" y="262" font-size="12" text-anchor="middle">System of Record 230</text>
  <text x="528" y="277" font-size="10" text-anchor="middle">(Next.js, NextAuth, Swahili-first)</text>

  <!-- Layer 300: Data -->
  <rect x="32" y="354" width="656" height="118" fill="none" stroke="#000" stroke-width="1"/>
  <text x="46" y="372" font-size="11">300  Data Layer</text>
  <rect x="56" y="382" width="400" height="64" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="256" y="402" font-size="12" text-anchor="middle">Relational Database (MySQL) 310</text>
  <text x="256" y="418" font-size="10" text-anchor="middle">facility profiles, assets, assessments, scores,</text>
  <text x="256" y="431" font-size="10" text-anchor="middle">recommendations, telemetry aggregates</text>
  <rect x="476" y="382" width="188" height="64" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="570" y="402" font-size="12" text-anchor="middle">Climate Dataset 320</text>
  <text x="570" y="418" font-size="10" text-anchor="middle">NASA POWER, ERA5</text>
  <text x="570" y="431" font-size="10" text-anchor="middle">(open data, Hugging Face)</text>

  <!-- Layer 400: Analytics and Scoring -->
  <rect x="32" y="500" width="656" height="260" fill="none" stroke="#000" stroke-width="1"/>
  <text x="46" y="518" font-size="11">400  Analytics and Scoring Layer</text>
  <rect x="56" y="530" width="300" height="170" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="206" y="552" font-size="12" text-anchor="middle">Scoring Engine (Deterministic) 410</text>
  <text x="206" y="567" font-size="10" text-anchor="middle">CRiPHC to RCS 0-100, top risks, costed plan</text>
  <text x="206" y="589" font-size="10.5" text-anchor="middle">Five CRiPHC dimensions:</text>
  <text x="206" y="605" font-size="10.5" text-anchor="middle">Hazard Exposure</text>
  <text x="206" y="620" font-size="10.5" text-anchor="middle">Critical Service Fragility</text>
  <text x="206" y="635" font-size="10.5" text-anchor="middle">Energy Continuity and Power Quality</text>
  <text x="206" y="650" font-size="10.5" text-anchor="middle">Efficiency and Demand Control</text>
  <text x="206" y="665" font-size="10.5" text-anchor="middle">Readiness and Response Capacity</text>
  <rect x="380" y="530" width="284" height="104" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="522" y="550" font-size="12" text-anchor="middle">Analytics and ML (Python) 420</text>
  <text x="522" y="566" font-size="10" text-anchor="middle">Chronos-48M fine-tuned climate forecast</text>
  <text x="522" y="579" font-size="10" text-anchor="middle">(open model, Hugging Face)</text>
  <text x="522" y="596" font-size="10" text-anchor="middle">rules, statistics, XGBoost, Isolation-Forest</text>
  <text x="522" y="610" font-size="10" text-anchor="middle">SHAP on every prediction, CPU-only</text>
  <rect x="380" y="668" width="134" height="60" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="447" y="688" font-size="10.5" text-anchor="middle">Energy Efficiency</text>
  <text x="447" y="703" font-size="10.5" text-anchor="middle">M&amp;V 430 (IPMVP C)</text>
  <rect x="530" y="668" width="134" height="60" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="597" y="688" font-size="10.5" text-anchor="middle">Carbon dMRV 440</text>
  <text x="597" y="703" font-size="10" text-anchor="middle">(avoided emissions)</text>

  <!-- Layer 500: Application and API -->
  <rect x="32" y="786" width="656" height="96" fill="none" stroke="#000" stroke-width="1"/>
  <text x="46" y="804" font-size="11">500  Application and API Layer</text>
  <rect x="140" y="812" width="440" height="50" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="360" y="832" font-size="12" text-anchor="middle">Next.js Application and REST API 510</text>
  <text x="360" y="848" font-size="10" text-anchor="middle">serves dashboards, drives messaging, exposes public feed</text>

  <!-- Layer 600: Delivery -->
  <rect x="32" y="908" width="656" height="112" fill="none" stroke="#000" stroke-width="1"/>
  <text x="46" y="926" font-size="11">600  Delivery Layer</text>
  <rect x="56" y="938" width="190" height="60" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="151" y="960" font-size="12" text-anchor="middle">Dashboards 610</text>
  <text x="151" y="976" font-size="10" text-anchor="middle">facility and portfolio views</text>
  <rect x="266" y="938" width="190" height="60" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="361" y="960" font-size="12" text-anchor="middle">SMS Notifications 620</text>
  <text x="361" y="976" font-size="10" text-anchor="middle">Swahili templates, fault reporting</text>
  <rect x="476" y="938" width="188" height="60" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="570" y="960" font-size="12" text-anchor="middle">Public Data Feed 630</text>
  <text x="570" y="976" font-size="10" text-anchor="middle">anonymised, read-only, exports</text>

  <!-- Layer 700: Consumers -->
  <rect x="32" y="1046" width="656" height="88" fill="none" stroke="#000" stroke-width="1"/>
  <text x="46" y="1064" font-size="11">700  Consumers</text>
  <rect x="56" y="1074" width="146" height="44" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="129" y="1100" font-size="10.5" text-anchor="middle">Facility Staff 710</text>
  <rect x="214" y="1074" width="146" height="44" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="287" y="1100" font-size="10.5" text-anchor="middle">Districts and NGOs 720</text>
  <rect x="372" y="1074" width="146" height="44" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="445" y="1100" font-size="10.5" text-anchor="middle">Financiers 730</text>
  <rect x="530" y="1074" width="146" height="44" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="603" y="1100" font-size="10.5" text-anchor="middle">Public and Researchers 740</text>

  <!-- Telemetry internal flow: 110 -> 120/130 -> 140 -->
  <line x1="192" y1="138" x2="120" y2="158" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="192" y1="138" x2="264" y2="158" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="120" y1="210" x2="120" y2="240" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="264" y1="210" x2="264" y2="240" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Assessment internal flow: 210 -> 220 -> 230 -->
  <line x1="528" y1="138" x2="528" y2="158" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="528" y1="210" x2="528" y2="240" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Into the data layer -->
  <line x1="192" y1="286" x2="192" y2="382" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="180" y="340" font-size="10" transform="rotate(-90 180 340)">telemetry</text>
  <line x1="528" y1="286" x2="410" y2="382" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="500" y="336" font-size="10">assessment data</text>

  <!-- Data layer to analytics -->
  <line x1="256" y1="446" x2="206" y2="530" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="256" y1="446" x2="470" y2="530" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="570" y1="446" x2="540" y2="530" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ML forecasts feed the scoring engine; ML feeds M&V and dMRV -->
  <line x1="380" y1="585" x2="356" y2="585" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="447" y1="634" x2="447" y2="668" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="597" y1="634" x2="597" y2="668" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Analytics output to application layer -->
  <line x1="360" y1="760" x2="360" y2="812" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="372" y="790" font-size="10">RCS, risks, adaptation plan</text>

  <!-- Application to delivery -->
  <line x1="360" y1="862" x2="151" y2="938" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="360" y1="862" x2="361" y2="938" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="360" y1="862" x2="570" y2="938" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Delivery to consumers -->
  <line x1="360" y1="1020" x2="360" y2="1046" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
</svg>
