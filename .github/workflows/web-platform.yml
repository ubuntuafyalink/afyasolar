name: web-platform CI

# Runs only when the web app changes (monorepo path scoping).
on:
  push:
    branches: [main]
    paths: ["web-platform/**", ".github/workflows/web-platform.yml"]
  pull_request:
    branches: [main]
    paths: ["web-platform/**", ".github/workflows/web-platform.yml"]

jobs:
  build-and-test:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Hard gate: the codebase is type-clean.
      - name: Type-check
        run: npm run type-check

      - name: Unit tests + coverage
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web-platform/coverage/
          if-no-files-found: ignore
