name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, type-check & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Non-blocking for now: the pre-existing codebase carries type errors in
      # ~18 legacy route files that predate this CI setup. The step still runs and
      # reports them so the debt is visible; drive it to zero, then remove
      # continue-on-error to make type-check a hard gate (target: mid-project).
      - name: Type-check
        run: npm run type-check
        continue-on-error: true

      - name: Unit tests + coverage
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
