version: 2
updates:
  - package-ecosystem: npm
    directory: /web-platform
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      radix:
        patterns:
          - "@radix-ui/*"

  - package-ecosystem: pip
    directory: /ai-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directories:
      - /web-platform
      - /ai-service
    schedule:
      interval: monthly
