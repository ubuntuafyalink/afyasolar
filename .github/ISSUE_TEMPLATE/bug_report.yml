name: Bug report
description: Something behaves differently from how it is documented.
labels: ["bug"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Which project
      options:
        - web-platform
        - ai-service
        - both / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you are running it, plus Node or Python version.
      placeholder: Docker Compose / self-hosted / local dev; Node 20.11; MySQL 8.0
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the actual error. Remove any secrets first.
      render: shell
