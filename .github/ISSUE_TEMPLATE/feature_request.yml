name: Feature request
description: Suggest a capability or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
  - type: textarea
    id: context
    attributes:
      label: Context
      description: >
        This platform serves health facilities on unreliable power and poor
        connectivity. If your request relates to that setting, say how.
